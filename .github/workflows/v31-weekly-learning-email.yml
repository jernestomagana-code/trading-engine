name: V31 Weekly Learning Email

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Preview without sending email"
        required: true
        default: "false"
        type: choice
        options:
          - "false"
          - "true"
      force:
        description: "Bypass weekly dedupe"
        required: true
        default: "false"
        type: choice
        options:
          - "false"
          - "true"
      limit:
        description: "Maximum reviews to summarize"
        required: true
        default: "500"
  schedule:
    # Monday morning UTC after prior week's learning checkpoints have run.
    - cron: "30 13 * * 1"

jobs:
  weekly-learning-email:
    name: Send V31 weekly learning email
    runs-on: ubuntu-latest
    steps:
      - name: Select send mode
        id: selected
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "dry_run=${{ inputs.dry_run }}" >> "$GITHUB_OUTPUT"
            echo "force=${{ inputs.force }}" >> "$GITHUB_OUTPUT"
            echo "limit=${{ inputs.limit }}" >> "$GITHUB_OUTPUT"
          else
            echo "dry_run=false" >> "$GITHUB_OUTPUT"
            echo "force=false" >> "$GITHUB_OUTPUT"
            echo "limit=500" >> "$GITHUB_OUTPUT"
          fi

      - name: Send or preview weekly learning email
        env:
          READ_ACCESS_TOKEN: ${{ secrets.STOCK_ULTIMUS_READ_ACCESS_TOKEN }}
          STOCK_ULTIMUS_BASE_URL: https://trading-engine-p097.onrender.com
          DRY_RUN: ${{ steps.selected.outputs.dry_run }}
          FORCE: ${{ steps.selected.outputs.force }}
          LIMIT: ${{ steps.selected.outputs.limit }}
        run: |
          python - <<'PY'
          import json
          import os
          import sys
          from urllib import error, parse, request

          token = os.environ.get("READ_ACCESS_TOKEN", "").strip()
          if not token:
              print("Missing STOCK_ULTIMUS_READ_ACCESS_TOKEN secret.")
              sys.exit(1)

          base = os.environ.get("STOCK_ULTIMUS_BASE_URL", "https://trading-engine-p097.onrender.com").rstrip("/")
          dry_run = os.environ.get("DRY_RUN", "false").strip().lower()
          force = os.environ.get("FORCE", "false").strip().lower()
          limit = os.environ.get("LIMIT", "500").strip()
          path = "/v31_manual_review_learning_notify/preview" if dry_run == "true" else "/v31_manual_review_learning_notify"
          query = parse.urlencode({
              "limit": limit,
              "force": force,
          })
          req = request.Request(
              base + path + "?" + query,
              data=None if dry_run == "true" else b"",
              method="GET" if dry_run == "true" else "POST",
              headers={"X-Stock-Ultimus-Read-Token": token},
          )
          try:
              with request.urlopen(req, timeout=45) as resp:
                  payload = json.loads(resp.read().decode("utf-8", errors="replace"))
                  status_code = resp.status
          except error.HTTPError as exc:
              body = exc.read().decode("utf-8", errors="replace")
              print(body)
              sys.exit(1)

          learning = payload.get("learning") or {}
          summary = {
              "status_code": status_code,
              "status": payload.get("status"),
              "would_notify": payload.get("would_notify"),
              "email_sent": payload.get("email_sent"),
              "deduped": (payload.get("dedupe") or {}).get("deduped"),
              "review_count": learning.get("review_count"),
              "evaluated_count": learning.get("evaluated_count"),
              "by_learning_label": learning.get("by_learning_label"),
              "not_order_instruction": payload.get("not_order_instruction"),
              "execution_authorized": payload.get("execution_authorized"),
          }
          print(json.dumps(summary, indent=2, sort_keys=True))

          if status_code != 200:
              sys.exit(1)
          if payload.get("not_order_instruction") is not True:
              print("No-order guardrail missing.")
              sys.exit(1)
          if payload.get("execution_authorized") is not False:
              print("Execution authorization guardrail failed.")
              sys.exit(1)
          if dry_run != "true" and payload.get("status") == "not_sent":
              sys.exit(1)
          PY
