services:
  - type: web
    name: trading-engine
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: DEPLOYMENT_ENV
        value: production
      - key: DEPLOYMENT_SCOPE
        value: personal
      - key: OPERATING_MODE
        value: ANALYSIS_ONLY
      - key: REQUIRE_SNAPSHOT_INGEST_TOKEN
        value: "true"
      - key: SNAPSHOT_INGEST_TOKEN
        sync: false
      - key: READ_ACCESS_TOKEN
        sync: false
      - key: REQUIRE_READ_AUTH
        value: "true"
      - key: RUNTIME_STORAGE_MODE
        value: local_json
      - key: DURABLE_STORAGE_PROVIDER
        value: ""
      - key: DURABLE_STORAGE_CONTRACT_VERSION
        value: ""
      - key: DURABLE_STORAGE_ENABLED
        value: "false"
      - key: STOCK_ULTIMUS_TENANT_ID
        value: personal
      - key: STOCK_ULTIMUS_ACCOUNT_SCOPE
        value: default
      - key: AUDIT_LOG_MAX_EVENTS
        value: "10000"
