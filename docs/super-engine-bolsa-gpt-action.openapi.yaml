openapi: 3.1.0
info:
  title: Stock Ultimus GPT Read API
  version: v31.0
  description: >
    Safe read-only endpoints for the Super Engine Bolsa custom GPT. These
    endpoints expose deterministic Stock Ultimus decision states, daily rankings,
    blockers, selected option contracts, freshness, and manual-review guardrails.
servers:
  - url: https://trading-engine-p097.onrender.com
    description: Production Render deployment
security:
  - StockUltimusReadToken: []
paths:
  /v31_system_status:
    get:
      operationId: getV31SystemStatus
      summary: Get Stock Ultimus V31 system status
      description: >
        Returns canonical decision-engine status, version fields, summary counts,
        available endpoints, and no-order guardrails.
      responses:
        "200":
          description: V31 system status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SystemStatus"
        "401":
          $ref: "#/components/responses/UnauthorizedRead"
        "503":
          $ref: "#/components/responses/ReadTokenNotConfigured"
  /gpt_v31_daily_rankings:
    get:
      operationId: getDailyRankings
      summary: Get GPT-safe daily opportunity rankings
      description: >
        Returns a compact daily ranking view for manual-review candidates,
        blocked/waiting candidates, all ranked items, data-readiness diagnostics,
        and answer guidance. This is the primary endpoint for answering "what
        opportunities do I have today?"
      responses:
        "200":
          description: GPT-safe daily rankings
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DailyRankings"
        "401":
          $ref: "#/components/responses/UnauthorizedRead"
        "503":
          $ref: "#/components/responses/ReadTokenNotConfigured"
  /gpt_v31_daily_answer:
    get:
      operationId: getDailyAnswer
      summary: Get ready-to-say daily answer for Super Engine Bolsa
      description: >
        Returns a Spanish institutional answer_text plus the supporting compact
        recommendation payload. Use this when the user asks for today's
        opportunities and wants a concise answer rather than raw ranking JSON.
      parameters:
        - name: limit
          in: query
          required: false
          description: Maximum number of manual-review and blocked/waiting items to include.
          schema:
            type: integer
            minimum: 1
            maximum: 10
            default: 5
      responses:
        "200":
          description: Ready-to-say daily answer
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DailyAnswer"
        "401":
          $ref: "#/components/responses/UnauthorizedRead"
        "503":
          $ref: "#/components/responses/ReadTokenNotConfigured"
  /gpt_v31_daily_brief:
    get:
      operationId: getDailyBrief
      summary: Get ultra-compact daily brief for Super Engine Bolsa
      description: >
        Returns a minimal JSON object with display_text already shaped for the
        Custom GPT. Use this first when ChatGPT should answer "what
        opportunities do I have today?" without processing the full supporting
        recommendation payload.
      parameters:
        - name: limit
          in: query
          required: false
          description: Maximum number of manual-review and blocked/waiting items to include.
          schema:
            type: integer
            minimum: 1
            maximum: 10
            default: 5
      responses:
        "200":
          description: Ultra-compact daily brief
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DailyBrief"
        "401":
          $ref: "#/components/responses/UnauthorizedRead"
        "503":
          $ref: "#/components/responses/ReadTokenNotConfigured"
  /gpt_v31_daily_plain:
    get:
      operationId: getDailyPlain
      summary: Get ready-to-send plain-text daily answer
      description: >
        Returns the exact Spanish text the Custom GPT should send to the user
        for questions like "what opportunities do I have today?". Use this
        before JSON endpoints when the user wants the daily radar or
        opportunities. The returned text is decision support only and does not
        authorize orders.
      parameters:
        - name: limit
          in: query
          required: false
          description: Maximum number of manual-review and blocked/waiting items to include.
          schema:
            type: integer
            minimum: 1
            maximum: 10
            default: 5
      responses:
        "200":
          description: Plain-text daily answer to return verbatim to the user
          content:
            text/plain:
              schema:
                type: string
                description: Copy this complete text verbatim as the user-facing answer.
        "401":
          $ref: "#/components/responses/UnauthorizedRead"
        "503":
          $ref: "#/components/responses/ReadTokenNotConfigured"
  /gpt_v31_daily_now:
    get:
      operationId: getDailyNow
      summary: Get current ready-to-send plain-text daily answer
      description: >
        Returns the current exact Spanish text the Custom GPT should send to
        the user for today's opportunity radar. Prefer this endpoint for live
        GPT conversations because the first line is self-contained and safe
        even if ChatGPT returns only one line. Decision support only; no order
        authorization.
      parameters:
        - name: limit
          in: query
          required: false
          description: Maximum number of manual-review and blocked/waiting items to include.
          schema:
            type: integer
            minimum: 1
            maximum: 10
            default: 5
      responses:
        "200":
          description: Current plain-text daily answer to return verbatim to the user
          content:
            text/plain:
              schema:
                type: string
                description: Copy this complete text verbatim as the user-facing answer.
        "401":
          $ref: "#/components/responses/UnauthorizedRead"
        "503":
          $ref: "#/components/responses/ReadTokenNotConfigured"
  /v31_command_center.json:
    get:
      operationId: getCommandCenter
      summary: Get Stock Ultimus V31 command center
      description: >
        Returns an executive daily operating view built from the same V31
        recommendation payload and data-readiness diagnostics used by GPT.
      responses:
        "200":
          description: V31 command center JSON
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CommandCenter"
        "401":
          $ref: "#/components/responses/UnauthorizedRead"
        "503":
          $ref: "#/components/responses/ReadTokenNotConfigured"
  /gpt_v31_trade_decision/{ticker}:
    get:
      operationId: getTickerDecision
      summary: Get GPT-safe ticker decision detail
      description: >
        Returns the canonical GPT-facing decision payload for one ticker,
        including final_state, blockers, missing fields, selected contract,
        technical context, risk context, freshness, explanation, and no-order
        guardrails.
      parameters:
        - name: ticker
          in: path
          required: true
          description: Stock or ETF ticker, for example QQQ or AAPL.
          schema:
            type: string
            minLength: 1
            maxLength: 12
            pattern: "^[A-Za-z0-9._-]+$"
      responses:
        "200":
          description: GPT-safe ticker decision detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TickerDecision"
        "401":
          $ref: "#/components/responses/UnauthorizedRead"
        "503":
          $ref: "#/components/responses/ReadTokenNotConfigured"
components:
  securitySchemes:
    StockUltimusReadToken:
      type: apiKey
      in: header
      name: X-Stock-Ultimus-Read-Token
      description: READ_ACCESS_TOKEN configured in the Stock Ultimus deployment.
  responses:
    UnauthorizedRead:
      description: Missing or invalid read token.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    ReadTokenNotConfigured:
      description: Read token is required by the server but not configured.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
  schemas:
    ErrorResponse:
      type: object
      properties:
        detail:
          type: string
    SystemStatus:
      type: object
      additionalProperties: true
      properties:
        engine:
          type: string
        decision_version:
          type: string
        strategy_version:
          type: string
        ruleset_version:
          type: string
        snapshot_version:
          type: string
        generated_at:
          type: string
        status:
          type: string
        canonical_states:
          type: array
          items:
            type: string
        source_engine:
          type: string
        master_snapshot_available:
          type: boolean
        summary:
          type: object
          additionalProperties: true
        not_order_instruction:
          type: boolean
    DailyRankings:
      type: object
      additionalProperties: true
      properties:
        engine:
          type: string
        ranking_version:
          type: string
        score_version:
          type: string
        generated_at:
          type: string
        summary:
          type: object
          additionalProperties: true
        data_readiness:
          $ref: "#/components/schemas/DataReadiness"
        answer_guidance:
          $ref: "#/components/schemas/AnswerGuidance"
        top_recommendations:
          type: array
          items:
            $ref: "#/components/schemas/RankingItem"
        items:
          type: array
          items:
            $ref: "#/components/schemas/RankingItem"
        no_trade:
          type: array
          items:
            $ref: "#/components/schemas/RankingItem"
        blocked_or_waiting:
          type: array
          description: Compact candidates that are not ENTRY_READY and must be explained as blocked or waiting.
          items:
            $ref: "#/components/schemas/RankingItem"
        top_manual_review:
          type: array
          deprecated: true
          items:
            $ref: "#/components/schemas/RankingItem"
        watchlist:
          type: array
          deprecated: true
          items:
            $ref: "#/components/schemas/RankingItem"
        blocked:
          type: array
          deprecated: true
          items:
            $ref: "#/components/schemas/RankingItem"
        research_only:
          type: array
          items:
            $ref: "#/components/schemas/RankingItem"
        risk_notes:
          type: array
          items:
            type: string
        execution_authorized:
          type: boolean
          const: false
        not_order_instruction:
          type: boolean
    DailyAnswer:
      type: object
      additionalProperties: true
      properties:
        engine:
          type: string
        answer_version:
          type: string
        generated_at:
          type: string
        answer_text:
          type: string
          description: Spanish answer safe to show to the user without inventing tickers or orders.
        summary:
          type: object
          additionalProperties: true
        data_readiness:
          $ref: "#/components/schemas/DataReadiness"
        top_recommendations:
          type: array
          items:
            $ref: "#/components/schemas/RankingItem"
        blocked_or_waiting:
          type: array
          items:
            $ref: "#/components/schemas/RankingItem"
        execution_authorized:
          type: boolean
          const: false
        not_order_instruction:
          type: boolean
    DailyBrief:
      type: object
      additionalProperties: false
      properties:
        brief_version:
          type: string
        response_mode:
          type: string
          description: Instructs the Custom GPT to copy the prepared answer without summarizing.
        answer_to_user:
          type: string
          description: Primary field. Copy this complete Spanish text verbatim to the user.
        generated_at:
          type: string
        status:
          type:
            - string
            - "null"
        operational_readiness:
          type:
            - string
            - "null"
        main_blocker:
          type:
            - string
            - "null"
        summary:
          type: object
          additionalProperties: true
        brief_text:
          type: string
        display_text:
          type: string
          description: Backward-compatible copy of answer_to_user.
        instruction_to_gpt:
          type: string
        execution_authorized:
          type: boolean
          const: false
        not_order_instruction:
          type: boolean
    CommandCenter:
      type: object
      additionalProperties: true
      properties:
        engine:
          type: string
        generated_at:
          type: string
        status:
          type:
            - string
            - "null"
        operational_readiness:
          type:
            - string
            - "null"
        main_blocker:
          type:
            - string
            - "null"
        summary:
          type: object
          additionalProperties: true
        top_recommendations:
          type: array
          items:
            $ref: "#/components/schemas/RankingItem"
        blocked_or_waiting:
          type: array
          items:
            $ref: "#/components/schemas/RankingItem"
        next_required_actions:
          type: array
          items:
            type: string
        execution_authorized:
          type: boolean
          const: false
        not_order_instruction:
          type: boolean
    RankingItem:
      type: object
      additionalProperties: true
      properties:
        rank:
          type:
            - integer
            - "null"
        ticker:
          type: string
        strategy:
          type: string
        final_state:
          type: string
        main_blocker:
          type:
            - string
            - "null"
        blockers:
          type: array
          items:
            type: string
        ranking_score:
          type:
            - number
            - "null"
        ranking_label:
          type:
            - string
            - "null"
        conviction_score:
          type:
            - number
            - "null"
        recommendation_action:
          type:
            - string
            - "null"
        why:
          type:
            - string
            - "null"
        instruction:
          type:
            - string
            - "null"
        manual_review_ready:
          type: boolean
        can_operate:
          type: boolean
        required_missing_fields:
          type: array
          items:
            type: string
        next_required_action:
          type:
            - string
            - "null"
        parameter_review_status:
          type:
            - string
            - "null"
        parameter_review_blockers:
          type: array
          items:
            type: string
        selected_contract:
          $ref: "#/components/schemas/SelectedContract"
    DataReadiness:
      type: object
      additionalProperties: true
      properties:
        diagnostic_version:
          type: string
        status:
          type: string
          description: NO_DATA, DEGRADED, or READY_FOR_DECISION_REVIEW.
        operational_readiness:
          type:
            - string
            - "null"
          description: May be WAIT_MARKET_WINDOW when data exists but timing is not actionable.
        explanation:
          type:
            - string
            - "null"
        main_blocker:
          type:
            - string
            - "null"
        blockers:
          type: array
          items:
            type: string
        master_snapshot_available:
          type: boolean
        option_rows_found:
          type: integer
        technical_count:
          type: integer
        decision_state_counts:
          type: object
          additionalProperties: true
        dominant_state:
          type:
            - string
            - "null"
        dominant_state_count:
          type: integer
        wait_market_like_count:
          type: integer
        all_wait_market:
          type: boolean
        next_required_actions:
          type: array
          items:
            type: string
        safe_to_invent_opportunities:
          type: boolean
          const: false
        execution_authorized:
          type: boolean
          const: false
        not_order_instruction:
          type: boolean
    AnswerGuidance:
      type: object
      additionalProperties: true
      properties:
        guidance_version:
          type: string
        lead_message:
          type: string
        must_call_action_first:
          type: boolean
        suggested_first_line:
          type: string
        manual_review_only:
          type: boolean
        execution_authorized:
          type: boolean
          const: false
        not_order_instruction:
          type: boolean
    TickerDecision:
      type: object
      additionalProperties: true
      properties:
        engine:
          type: string
        contract_schema_version:
          type: string
        decision_id:
          type:
            - string
            - "null"
        decision_version:
          type: string
        strategy_version:
          type: string
        ruleset_version:
          type: string
        snapshot_version:
          type: string
        ticker:
          type: string
        strategy:
          type: string
        decision:
          type: string
        final_state:
          type: string
        main_blocker:
          type:
            - string
            - "null"
        blockers:
          type: array
          items:
            type: string
        required_missing_fields:
          type: array
          items:
            type: string
        selected_contract:
          $ref: "#/components/schemas/SelectedContract"
        technical:
          type: object
          additionalProperties: true
        risk:
          type: object
          additionalProperties: true
        strategy_registry:
          type: object
          additionalProperties: true
        score_components:
          type: object
          additionalProperties: true
        freshness:
          type: object
          additionalProperties: true
        explanation:
          type:
            - string
            - "null"
        next_required_action:
          type:
            - string
            - "null"
        risk_notes:
          type: array
          items:
            type:
              - string
              - "null"
        ready_for_manual_review:
          type: boolean
        execution_authorized:
          type: boolean
          const: false
        not_order_instruction:
          type: boolean
        audit:
          type: object
          additionalProperties: true
        generated_at:
          type: string
    SelectedContract:
      type: object
      additionalProperties: true
      properties:
        selected_contract_version:
          type:
            - string
            - "null"
        ticker:
          type:
            - string
            - "null"
        strategy:
          type:
            - string
            - "null"
        strike:
          type:
            - number
            - "null"
        expiration:
          type:
            - string
            - "null"
        dte:
          type:
            - number
            - "null"
        bid:
          type:
            - number
            - "null"
        ask:
          type:
            - number
            - "null"
        mid:
          type:
            - number
            - "null"
        spread:
          type:
            - number
            - "null"
        spread_pct:
          type:
            - number
            - "null"
        delta:
          type:
            - number
            - "null"
        iv:
          type:
            - number
            - "null"
        volume:
          type:
            - number
            - "null"
        open_interest:
          type:
            - number
            - "null"
        data_quality:
          type:
            - string
            - "null"
        source_decision:
          type:
            - string
            - "null"
        source_score:
          type:
            - number
            - "null"
