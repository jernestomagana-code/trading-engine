services:
  - type: web
    name: trading-engine
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: DEPLOYMENT_ENV
        value: production
      - key: DEPLOYMENT_SCOPE
        value: personal
      - key: OPERATING_MODE
        value: ANALYSIS_ONLY
      - key: REQUIRE_SNAPSHOT_INGEST_TOKEN
        value: "true"
      - key: SNAPSHOT_INGEST_TOKEN
        sync: false
      - key: READ_ACCESS_TOKEN
        sync: false
      - key: REQUIRE_READ_AUTH
        value: "true"
